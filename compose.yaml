name: linked-realms

# The "world" profile (docker compose --profile world up -d) adds the Hub, the relay and three Map
# servers on top of the default services. Run it as its own project so it never touches the
# default stack's state:
#   POSTGRES_PORT=5433 docker compose -p linked-realms-world --profile world up -d --build
# Every key below comes from anvil's public test mnemonic: local development only, never secret.

x-node: &node
  build: .
  image: linked-realms-node:local
  profiles: [world]
  restart: "no"

x-map: &map
  <<: *node
  environment: &map-env
    RELAY_URL: ws://relay:8080
    # anvil dev account 9, the address of HUB_TICKET_KEY below
    HUB_TICKET_SIGNER: "0xa0Ee7A142d267C1f36714E4a8F75612F20a79720"
  depends_on:
    relay:
      condition: service_healthy
  healthcheck:
    test: ["CMD-SHELL", "nc -z 127.0.0.1 2567"]
    interval: 5s
    timeout: 3s
    retries: 10

services:
  postgres:
    image: postgres:18.6-alpine3.24
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-linked_realms}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-linked_realms}
      POSTGRES_DB: ${POSTGRES_DB:-linked_realms}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  hub-api:
    <<: *node
    command: ["node", "packages/hub-api/src/main.ts"]
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-linked_realms}:${POSTGRES_PASSWORD:-linked_realms}@postgres:5432/${POSTGRES_DB:-linked_realms}
      RELAY_INTERNAL_URL: http://relay:8080
      RELAY_PUBLIC_URL: http://127.0.0.1:${RELAY_PORT:-8080}
      # anvil dev account 9: signs Travel tickets and holds nothing. LOCAL ONLY, public test key.
      HUB_TICKET_KEY: "0x2a871d0798f97d79848a013d4936a73bf4cc922c825d33c1cf7073dff6d409c6"
      HUB_SESSION_SECRET: local-only-session-secret-not-for-any-real-deployment
      HUB_ALLOWED_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
    ports:
      - "127.0.0.1:${HUB_PORT:-8787}:8787"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8787/health"]
      interval: 5s
      timeout: 3s
      retries: 10

  relay:
    <<: *node
    command: ["node", "packages/relay/src/main.ts"]
    environment:
      HUB_URL: http://hub-api:8787
    ports:
      - "127.0.0.1:${RELAY_PORT:-8080}:8080"
    depends_on:
      hub-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/health"]
      interval: 5s
      timeout: 3s
      retries: 10

  map-1:
    <<: *map
    environment: { <<: *map-env, LAND_ID: "1" }
    volumes: [map-1-data:/data]

  map-2:
    <<: *map
    environment: { <<: *map-env, LAND_ID: "2" }
    volumes: [map-2-data:/data]

  map-3:
    <<: *map
    environment: { <<: *map-env, LAND_ID: "3" }
    volumes: [map-3-data:/data]

volumes:
  postgres-data:
  map-1-data:
  map-2-data:
  map-3-data:
