name: linked-realms

# The "world" profile (docker compose --profile world up -d) adds the Hub, the relay, the Shell, a
# seed Node of LR and two Map servers on top of PostgreSQL. Each Map server runs its own Node on
# LR's dev network, whose easy fixed Target wins Blocks in seconds; every Mine is off until its Land
# owner switches it on. Run it as its own project so it never touches the default
# stack's state:
#   POSTGRES_PORT=5433 docker compose -p linked-realms-world --profile world up -d --build
# Then open the Shell at http://localhost:8788 (README: Run the world).
#
# DEVELOPMENT KEYS. Every key and Character below is public: local development only, never for
# anything that holds value. The Characters' 24 words are in the README and the world e2e test.

x-node: &node
  build: .
  image: linked-realms-node:local
  profiles: [world]
  restart: "no"

x-map: &map
  <<: *node
  environment: &map-env
    HUB_URL: http://hub-api:8787
    # The Hub's host as statements name it: the one the Shell uses.
    HUB_DOMAIN: localhost:${HUB_PORT:-8787}
    # The ticket signer comes from the Hub's GET /keys. The relay is pinned: the Hub publishes the
    # address a Map server on this machine dials, and inside compose the relay is relay:8080.
    RELAY_URL: ws://relay:8080
    # The Land's Node, which the Map server spawns with its chain in /data/lr-node.
    NODE_NETWORK: dev
    NODE_SEEDS: seed:9444
  depends_on:
    relay:
      condition: service_healthy
    seed:
      condition: service_healthy
  healthcheck:
    test: ["CMD-SHELL", "nc -z 127.0.0.1 2567"]
    interval: 5s
    timeout: 3s
    retries: 10

services:
  postgres:
    image: postgres:18.6-alpine3.24
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-linked_realms}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-linked_realms}
      POSTGRES_DB: ${POSTGRES_DB:-linked_realms}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  hub-api:
    <<: *node
    command: ["node", "packages/hub-api/src/main.ts"]
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-linked_realms}:${POSTGRES_PASSWORD:-linked_realms}@postgres:5432/${POSTGRES_DB:-linked_realms}
      HUB_DOMAIN: localhost:${HUB_PORT:-8787}
      # Development key (32 bytes of 0x48): signs Travel tickets, which only let a Character in.
      HUB_TICKET_KEY: "4848484848484848484848484848484848484848484848484848484848484848"
      HUB_SESSION_SECRET: local-only-session-secret-not-for-any-real-deployment
      # The development admin (entropy of 32 bytes of 0x03).
      HUB_ADMINS: tlr1qqqllx6mk2aqte7cu6qlpkdrdr4xt2g34dfy663wp8va0h23nrnwpdsq4rn2n
      HUB_ALLOWED_ORIGINS: http://localhost:${SHELL_PORT:-8788}
      RELAY_INTERNAL_URL: http://relay:8080
      RELAY_PUBLIC_URL: ws://localhost:${RELAY_PORT:-8080}
      LAND_BASE_DOMAIN: localhost:${RELAY_PORT:-8080}
    ports:
      - "127.0.0.1:${HUB_PORT:-8787}:8787"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8787/health"]
      interval: 5s
      timeout: 3s
      retries: 10

  relay:
    <<: *node
    command: ["node", "packages/relay/src/main.ts"]
    environment:
      HUB_URL: http://hub-api:8787
      # The host Map servers dial; the Lands are <landId>.localhost:<RELAY_PORT>.
      RELAY_HOST: relay:8080
      LAND_BASE_DOMAIN: localhost:${RELAY_PORT:-8080}
      SHELL_ORIGINS: http://localhost:${SHELL_PORT:-8788}
    ports:
      # Both loopbacks: macOS resolves *.localhost to ::1 only.
      - "127.0.0.1:${RELAY_PORT:-8080}:8080"
      - "[::1]:${RELAY_PORT:-8080}:8080"
    depends_on:
      hub-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/health"]
      interval: 5s
      timeout: 3s
      retries: 10

  shell:
    build:
      context: .
      target: shell
      args:
        VITE_HUB_URL: http://localhost:${HUB_PORT:-8787}
        VITE_NODE_URL: http://localhost:${NODE_RPC_PORT:-9445}
        VITE_NETWORK: dev
    image: linked-realms-shell:local
    profiles: [world]
    restart: "no"
    ports:
      - "127.0.0.1:${SHELL_PORT:-8788}:80"

  # The Node every Land's Node dials first. Its RPC is the world's Public node: the Shell reads
  # balances and sends Gold through it.
  seed:
    <<: *node
    command:
      - lr-node
      - --network
      - dev
      - --data
      - /data
      - --listen
      - 0.0.0.0:9444
      - --rpc
      - 0.0.0.0:9445
    ports:
      - "127.0.0.1:${NODE_RPC_PORT:-9445}:9445"
    volumes: [seed-data:/data]
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 9444"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Each Map server keeps its own key and its Node's chain in its volume, and names its owner. A
  # Character registers it from the Shell's "Your Land". The limits show both of the Mine's modes
  # and the thread cap: map-1 has room for fast mode's 2 GiB dataset and 2 threads (3 CPUs less
  # one); map-2 mines in light mode with 1 thread.
  map-1:
    <<: *map
    # Development Character 1 (entropy of 32 bytes of 0x01).
    environment:
      {
        <<: *map-env,
        LAND_OWNER: tlr1qqqanzv64uheqjxt9vau0el7p0gndh7rmaykuhd3g9h3dyu0fzrr0mqulz55w,
      }
    volumes: [map-1-data:/data]
    mem_limit: 3g
    cpus: 3

  map-2:
    <<: *map
    # Development Character 2 (entropy of 32 bytes of 0x02).
    environment:
      {
        <<: *map-env,
        LAND_OWNER: tlr1qqq6mwhq8utpqyv32mfjujhr0tquwgkaek95p2rheewme5q2hcm2zzg40pln3,
      }
    volumes: [map-2-data:/data]
    mem_limit: 1g
    cpus: 2

volumes:
  postgres-data:
  seed-data:
  map-1-data:
  map-2-data:
