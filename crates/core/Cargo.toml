[package]
name = "linked-realms-core"
version = "0.1.0"
description = "Chain rules, keys, signatures and addresses shared by the Node, the Mine and the Shell"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
bech32 = "0.12.0"
bip39 = { version = "3", default-features = false, features = ["alloc", "zeroize"] }
fips204 = { version = "0.5", default-features = false, features = ["ml-dsa-44"] }
hkdf = "0.13"
sha2 = "0.11.1"
sha3 = "0.12.0"
wasm-bindgen = { version = "=0.2.129", optional = true }
zeroize = "1.9.1"

[features]
wasm = ["dep:wasm-bindgen"]

[dev-dependencies]
hex = "0.4.3"
ml-dsa = "=0.1.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

