[package]
name = "linked-realms-node"
version = "0.1.0"
description = "The LR Node: stores the chain and follows its best branch"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "lr-node"
path = "src/main.rs"

[dependencies]
linked-realms-core = { path = "../core" }
linked-realms-randomx = { path = "../randomx" }
# Pinned: the database file's format is redb's.
redb = "=4.4.0"
hex = "0.4.3"
http = "1"
hyper = "1"
jsonrpsee = { version = "=0.26.1", features = ["server"] }
# Thread priority and memory figures for the Mine.
libc = "0.2.191"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "net", "sync", "macros", "time", "signal"] }
tower = "0.5"
# The Checkpoint signer's words, wiped once read.
zeroize = "1.9.1"

[dev-dependencies]
# A WebSocket client for the RPC's subscriptions, without TLS.
jsonrpsee-core = { version = "=0.26.1", features = ["client"] }
jsonrpsee-ws-client = { version = "=0.26.1", default-features = false }
