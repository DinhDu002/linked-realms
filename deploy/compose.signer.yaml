# LR's Checkpoint signer (docs/runbooks/public-world.md, "7. The chain"), on the project owner's
# own machine and never on the server of deploy/compose.chain.yaml: its key can rewrite deep
# history (ADR 0015). The key is the 24 words in a file on this machine, mounted as a secret; it
# is in no image. Nothing is published: the signer only dials the seed.
#
#   LR_SEED=seed.example.org:9444 CHECKPOINT_WORDS=/path/to/words \
#     docker compose -f deploy/compose.signer.yaml up -d --build
name: linked-realms-signer

services:
  signer:
    build:
      context: ..
      target: lr-node
    image: linked-realms-lr-node:signer
    restart: unless-stopped
    command:
      - sign
      - --checkpoint-words
      - /run/secrets/checkpoint-words
      - --network
      - ${LR_NETWORK:-test}
      - --data
      - /data
      - --rpc
      - "off"
      - --seed
      - ${LR_SEED:?the company's seed, HOST:PORT}
    secrets:
      - checkpoint-words
    volumes:
      - signer-data:/data

secrets:
  checkpoint-words:
    # The image's user, 10001, reads it: on Linux, sudo chown 10001 FILE && sudo chmod 0400 FILE.
    file: ${CHECKPOINT_WORDS:?the file of the 24 words, on this machine}

volumes:
  signer-data:
