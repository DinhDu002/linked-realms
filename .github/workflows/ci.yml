name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typescript:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      # packages/core is the WASM build of crates/core (ADR 0009).
      - run: rustup toolchain install
      - name: Install wasm-bindgen-cli
        run: |
          curl -sSfL -o wasm-bindgen.tar.gz "https://github.com/wasm-bindgen/wasm-bindgen/releases/download/$V/wasm-bindgen-$V-x86_64-unknown-linux-musl.tar.gz"
          echo "82d12bb940e2d4e72e0d5605387fc1b8ca179044e012b620f0ce4e7440e8320e  wasm-bindgen.tar.gz" | sha256sum -c
          tar -xzf wasm-bindgen.tar.gz --strip-components=1 -C "$HOME/.cargo/bin" "wasm-bindgen-$V-x86_64-unknown-linux-musl/wasm-bindgen"
        env:
          V: 0.2.129 # the wasm-bindgen version in crates/core/Cargo.toml
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

  # The isolation half of step 2B's done-when, in real browsers: a hostile Land in the Shell's frame.
  browser:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      # packages/core is the WASM build of crates/core (ADR 0009); the Shell is built on it.
      - run: rustup toolchain install
      - name: Install wasm-bindgen-cli
        run: |
          curl -sSfL -o wasm-bindgen.tar.gz "https://github.com/wasm-bindgen/wasm-bindgen/releases/download/$V/wasm-bindgen-$V-x86_64-unknown-linux-musl.tar.gz"
          echo "82d12bb940e2d4e72e0d5605387fc1b8ca179044e012b620f0ce4e7440e8320e  wasm-bindgen.tar.gz" | sha256sum -c
          tar -xzf wasm-bindgen.tar.gz --strip-components=1 -C "$HOME/.cargo/bin" "wasm-bindgen-$V-x86_64-unknown-linux-musl/wasm-bindgen"
        env:
          V: 0.2.129 # the wasm-bindgen version in crates/core/Cargo.toml
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @linked-realms/core build
      - run: pnpm --filter @linked-realms/shell exec playwright install --with-deps chromium firefox
      - run: pnpm --filter @linked-realms/shell test:browser

  # The reference kit's game protocol: lint the .proto and check the committed code is current.
  buf:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @linked-realms/shared proto
      - name: Generated code in packages/shared/src/gen is current
        run: |
          git status --porcelain -- packages/shared/src/gen
          test -z "$(git status --porcelain -- packages/shared/src/gen)"

  rust:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo test

  image:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Build only: publishing the images is the project owner's step (docs/self-hosting.md).
      - run: docker build -t linked-realms-node:ci .
      - run: docker build --target shell -t linked-realms-shell:ci .
