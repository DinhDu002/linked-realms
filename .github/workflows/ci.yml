name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  packages: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typescript:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

  # In real browsers: the isolation half of step 2B's done-when (a hostile Land in the Shell's frame),
  # and the Land owner's Mine switch.
  browser:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: pnpm --filter @linked-realms/shell exec playwright install --with-deps chromium firefox
      - run: pnpm --filter @linked-realms/shell test:browser
      # The Land's Mine: the Land UI and its Map server, with a fake Node, in a stub Shell.
      - run: pnpm --filter @linked-realms/client test:browser

  # The reference kit's game protocol: lint the .proto and check the committed code is current.
  buf:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: pnpm --filter @linked-realms/shared proto
      - name: Generated code in packages/shared/src/gen is current
        run: |
          git status --porcelain -- packages/shared/src/gen
          test -z "$(git status --porcelain -- packages/shared/src/gen)"

  image:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Build only: image.yml publishes the Map server image from main. The token is a BuildKit
      # secret (the Dockerfile's header), so it never lands in a layer.
      - run: docker build --secret id=node_auth_token,env=NODE_AUTH_TOKEN -t linked-realms-node:ci .
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: docker build --secret id=node_auth_token,env=NODE_AUTH_TOKEN --target shell -t linked-realms-shell:ci .
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
