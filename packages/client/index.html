<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>linked-realms</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #111;
        color: #eee;
        font:
          14px/1.4 system-ui,
          sans-serif;
      }
      #game {
        position: fixed;
        inset: 0;
      }
      #hud {
        position: fixed;
        z-index: 1;
        top: 12px;
        right: 12px;
        max-width: 320px;
        overflow-wrap: anywhere;
        background: rgba(0, 0, 0, 0.8);
        border: 1px solid #555;
        border-radius: 6px;
        padding: 10px 12px;
      }
      #hud-notice {
        color: #fc6;
      }
      #status {
        color: #9cf;
      }
      #error {
        color: #f88;
        overflow-wrap: anywhere;
      }
      [hidden] {
        display: none !important;
      }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <div id="hud">
      <div id="hud-land"></div>
      <div id="status"></div>
      <div id="hud-notice"></div>
      <div id="error"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
