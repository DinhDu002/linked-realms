// The reference Land kit's game protocol between a Land UI and its Map server, over the
// WebSocket at /play. It is a reference, not a mandatory protocol: another Land may speak
// anything to its own UI. Code is generated with `pnpm --filter @linked-realms/shared proto`.
syntax = "proto3";

package linked_realms.land.v1;

// A signed statement as docs/protocols/identity.md sends it: the text, then standard base64.
message SignedStatement {
  string statement = 1;
  string public_key = 2;
  string signature = 3;
}

message ClientMessage {
  oneof message {
    Hello hello = 1;
    Input input = 2;
    // Mining (docs/protocols/map-server-node.md).
    MineSwitch mine_switch = 20;
  }
  // Mining, later.
  reserved 21 to 29;
}

// The first message on a connection: the handoff from the Shell (docs/protocols/arrival.md).
message Hello {
  SignedStatement ticket = 1;
  SignedStatement arrival = 2;
}

// The Land owner switches the Land's Mine: a Land message signed in the Shell whose Message is a
// Mine switch line (docs/protocols/map-server-node.md).
message MineSwitch {
  SignedStatement signed = 1;
}

// Where the Character is walking: dx and dy are -1, 0 or 1. Sent whenever they change.
message Input {
  sint32 dx = 1;
  sint32 dy = 2;
  // Grows with every Input; Moved echoes the last one applied.
  uint32 seq = 3;
}

message ServerMessage {
  oneof message {
    Welcome welcome = 1;
    Character joined = 2;
    Left left = 3;
    Moved moved = 4;
    Notice notice = 5;
    Error error = 6;
    // Mining (docs/protocols/map-server-node.md).
    MineState mine_state = 20;
    MineSwitchResult mine_switch_result = 21;
    MineWon mine_won = 22;
  }
  // Mining, later.
  reserved 23 to 29;
}

// Sent once, after the handoff is accepted: everything a new Character needs.
message Welcome {
  // The receiving Character's id.
  uint32 you = 1;
  Land land = 2;
  // The Land's Tiled JSON text. The Land UI validates it with parseLandMap (P6).
  string map = 3;
  repeated Character characters = 4;
}

message Land {
  uint64 land_id = 1;
  string owner = 2;
  string owner_name = 3;
}

message Character {
  // Unique among the Characters on this Map server while it runs.
  uint32 id = 1;
  string address = 2;
  // The ticket's Name; may be empty.
  string name = 3;
  float x = 4;
  float y = 5;
  bool is_owner = 6;
  // Self-declared in the arrival; the Land UI shows a marker (arrival.md).
  bool driven_by_ai = 7;
}

message Left {
  uint32 id = 1;
}

// Only the Characters that moved since the last tick.
message Moved {
  repeated Position positions = 1;
  // The last Input seq applied for the receiving Character.
  uint32 seq = 2;
}

message Position {
  uint32 id = 1;
  float x = 2;
  float y = 3;
}

message Notice {
  string text = 1;
}

// The Map server closes the connection after sending it.
message Error {
  // An arrival.md code, or "full", "duplicate", "rate-limited", "bad-message", or
  // "unavailable" while the Map server does not yet know its Land.
  string code = 1;
  string message = 2;
}

// The Land's Mine as the Map server reports it: to everyone after Welcome, on each change, and
// about every 2 seconds while on. A visitor cannot verify it (P1).
message MineState {
  // "off", "starting", "on", or "unavailable" while the Land has no Node or it is not synced.
  string status = 1;
  // Threads hashing now.
  uint32 threads = 2;
  // The most threads the Land owner may choose.
  uint32 max_threads = 3;
  // Hashes a second over the last 10 seconds.
  double hash_rate = 4;
  // "fast" or "light" while starting or on; empty when off.
  string mode = 5;
  // The Land owner's address the Mine mines for; empty before its first start.
  string reward_address = 6;
  // Blocks the Mine won since its Node started.
  uint32 blocks_won = 7;
  // Only in the Land owner's copy, for the next switch: this session's challenge (the switch's
  // Nonce) and the Map server's own address (its Map server key). Empty in everyone else's.
  string challenge = 8;
  string map_server_key = 9;
}

// The answer to the session that sent a MineSwitch.
message MineSwitchResult {
  bool ok = 1;
  // When not ok: "not-owner", "bad-statement", "stale", "wrong-nonce", "bad-threads",
  // "unavailable" or "rate-limited".
  string code = 2;
}

// The Land's Mine won a Block: to everyone.
message MineWon {
  uint64 height = 1;
  // Base units as a decimal string: the Block reward at that height plus the Block's fees.
  string reward = 2;
  string reward_address = 3;
}
